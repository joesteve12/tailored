name: tailored_business_app
description: "Tailored — Business App (tailor shop management)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.0
  # Adaptive navigation shell (bottom NavigationBar <-> NavigationRail). This is
  # a maintained fork of the now-discontinued flutter_adaptive_scaffold, with an
  # identical public API (AdaptiveScaffold / SlotLayout / Breakpoint).
  canonical_adaptive_scaffold: ^0.3.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  # New for Phase 2 (Clients): camera/gallery picker for client photo
  # upload, feeding ClientRepository.uploadPhoto().
  image_picker: ^1.1.2
  # New for Phase 7 (Assignments + work order): fetch the generated
  # per-item work-order PDF, write it to a temp file (path_provider) and
  # hand it to the OS share sheet (share_plus) for WhatsApp delivery. Both
  # versions are pinned below 10.x / held compatible with the Dart 3.3 floor
  # (share_plus 10 requires Dart >=3.4). Reused later for invoice/receipt.
  share_plus: ^9.0.0
  path_provider: ^2.1.4
  # New for the Task system (to-do reminders): device-local notifications
  # scheduled at each to-do's server-computed remind_at.
  #
  # Upgraded flutter_timezone to a modern release compatible with Flutter 3.35
  # and Android embedding v2 to avoid compile failures from the legacy plugin
  # implementation in the 1.x series.
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # Brand fonts from tokens.json. Both are variable TrueType files (OFL,
  # bundled from github.com/google/fonts): a single asset per family covers
  # every weight via the `wght` axis, which Flutter maps `fontWeight` onto.
  #   - Inter    -> the sans body face (ThemeData.fontFamily)
  #   - Fraunces -> the display/serif voice (AppTokens.fontDisplay)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    # Monospace for money figures only (the receipt/claim-ticket look): its
    # tabular digits keep amount columns aligned. Referenced by name in
    # payment_section.dart. Labels on those cards use Inter.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
